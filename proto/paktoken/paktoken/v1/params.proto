syntax = "proto3";
package paktoken.paktoken.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "paktoken/x/paktoken/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "paktoken/x/paktoken/Params";
  option (gogoproto.equal) = true;
}
