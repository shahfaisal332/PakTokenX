syntax = "proto3";
package paktoken.tokenization.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "paktoken/x/tokenization/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "paktoken/x/tokenization/Params";
  option (gogoproto.equal) = true;
}
